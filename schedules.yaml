# github-trending-digest scheduled tasks (declarative).
#
# To register on a fresh machine, open Cowork (Claude Code) in this project
# and say: "Read schedules.yaml and register every task defined here."
#
# Times are local time (assumed PT for this codebase). Skill paths are
# relative to the project root.
#
# {{REPO}} is replaced by the absolute path of this project's root at
# registration time. Don't hardcode user-specific paths in this file.

- name: github-trending-fetch
  skill: null
  script: cd {{REPO}} && python3 github_fetch.py
  frequency: daily 09:30 PT
  description: Scrape GitHub Trending (3 lists) into SQLite, then record star history, README excerpts and lifecycle statuses (uses the gh token for the GitHub API).

- name: github-trending-digest
  skill: .claude/skills/github-trending-digest
  frequency: daily 11:30 PT
  description: Daily v2 digest (writer + targeted fact-check, Python renders/checks). Save to summaries table + send via email_sender.py (Gmail SMTP; falls back to a Gmail draft via MCP).

- name: github-trending-weekly
  skill: .claude/skills/github-trending-weekly
  frequency: weekly Monday 11:45 PT
  description: Weekly deep report (本月/本周 Top 10 by our own gains, 深读, movers, lifecycle events). Sends with `email_sender.py --kind weekly` (subject 「GitHub Trending 周报 YYYY-MM-DD」).
